---
# ===================================================================
# Gencraft Studio - Canonical Pre-Commit Configuration v1.0
# SSoT: gcs-core-governance/foundations/devops-standards/.pre-commit-config.yaml
# ===================================================================

repos:
  # ===== Generic File Checks =====
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-xml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: detect-private-key # Detects the presence of private keys
      - id: mixed-line-ending # Replaces mixed line endings with a consistent one (LF by default)
      - id: trailing-whitespace

  # ===== Security Scanning (Secrets) =====
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ===== Documentation Quality (Spelling) =====
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # Exclude files that may produce false positives
        exclude: .*\.lock|pyproject.toml|.*\.js

  # ===== YAML Linting =====
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['--config-file', '.yamllint.yaml']

  # ===== Commit Message Validation =====
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  # ===== Markdown Linting =====
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.yaml"]

  # ===== Gencraft SSoT Linters (Custom Hooks) =====
  - repo: https://github.com/GenCr-ft/gcd-ops-scripts.git
    rev: v4.0.0 # Use the latest stable tag of our tools
    hooks:
      - id: metadata-linter
        exclude: &ssot_exclude ^(tests/fixtures/|integration_test_docs/)
      - id: naming-linter
        exclude: *ssot_exclude
      - id: link-linter
        exclude: *ssot_exclude
