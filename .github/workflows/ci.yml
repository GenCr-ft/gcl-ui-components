name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: bash test.sh
        timeout-minutes: 10

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Secret scan — detect-secrets
        # backlog#487: hard gate — do NOT add continue-on-error or || true
        run: |
          python3 -m pip install detect-secrets==1.5.0 -q
          detect-secrets scan > /tmp/current_scan.json
          python3 - <<'PYEOF'
import json, sys
baseline = json.load(open(".secrets.baseline"))
current = json.load(open("/tmp/current_scan.json"))
b_known = {(f, s["hashed_secret"]) for f, ss in baseline.get("results", {}).items() for s in ss}
new = [(f, s) for f, ss in current.get("results", {}).items() for s in ss if (f, s["hashed_secret"]) not in b_known]
if new:
    print("ERROR: Unbaselined secrets found — run 'detect-secrets scan > .secrets.baseline' to review:")
    for f, s in sorted(new):
        print(f"  {f}:{s['line_number']} ({s['type']})")
    sys.exit(1)
print("detect-secrets: OK — no new secrets.")
PYEOF

  ssot-compliance:
    name: SSoT Compliance Check
    uses: GenCr-ft/gcd-shared-actions/.github/workflows/reusable-ssot-linter.yml@v1.3.0
    secrets:
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
    with:
      continue-on-error: false
      governance-version: "v1.4.0"
      tooling-version: "v4.1.2"
